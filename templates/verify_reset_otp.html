{% extends 'base.html' %}
{% block title %}Verify OTP — BCA Admissions{% endblock %}
{% block content %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 300px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  
  .auth-card {
    background: white;
    border-radius: 24px;
    padding: 2.5rem;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    border: 1px solid #eef2f8;
    transition: transform 0.3s ease;
  }
  
  .auth-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
  }
  
  .auth-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: #0a1f44;
    margin-bottom: 0.5rem;
    text-align: center;
  }
  
  .auth-sub {
    color: #5a6e82;
    text-align: center;
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }
  
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
  
  .field {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  
  .field label {
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #4a627a;
  }
  
  .req {
    color: #c9a03d;
    font-size: 1rem;
  }
  
  .otp-input {
    padding: 0.9rem 1rem;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 1.5rem;
    text-align: center;
    letter-spacing: 0.5rem;
    font-family: 'DM Sans', monospace;
    transition: all 0.3s ease;
    background: #fff;
  }
  
  .otp-input:focus {
    outline: none;
    border-color: #c9a03d;
    box-shadow: 0 0 0 3px rgba(201, 160, 61, 0.1);
  }
  
  .btn-full {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.9rem;
    font-size: 1rem;
    font-weight: 600;
  }
  
  .resend-btn {
    text-align: center;
    margin-top: 1rem;
  }
  
  .resend-btn button {
    background: none;
    border: none;
    color: #c9a03d;
    cursor: pointer;
    font-size: 0.85rem;
    transition: color 0.3s ease;
  }
  
  .resend-btn button:hover {
    color: #b58c2e;
    text-decoration: underline;
  }
  
  .back-link {
    text-align: center;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid #eef2f8;
  }
  
  .back-link a {
    color: #c9a03d;
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.3s ease;
  }
  
  .back-link a:hover {
    color: #b58c2e;
    text-decoration: underline;
  }
  
  .email-highlight {
    color: #c9a03d;
    font-weight: 600;
  }
  
  /* Dark theme support */
  body.dark .auth-card {
    background: #1a2538;
    border-color: #2d3e54;
  }
  
  body.dark .auth-title {
    color: #eef2ff;
  }
  
  body.dark .auth-sub {
    color: #b9c8e8;
  }
  
  body.dark .field label {
    color: #c9a03d;
  }
  
  body.dark .otp-input {
    background: #0f1a24;
    border-color: #2d3e54;
    color: #eef2ff;
  }
  
  body.dark .otp-input:focus {
    border-color: #c9a03d;
    box-shadow: 0 0 0 3px rgba(201, 160, 61, 0.2);
  }
  
  body.dark .back-link {
    border-top-color: #2d3e54;
  }
  
  @media (max-width: 480px) {
    .auth-card {
      padding: 1.8rem;
    }
    
    .auth-title {
      font-size: 1.5rem;
    }
    
    .otp-input {
      font-size: 1.2rem;
      letter-spacing: 0.3rem;
    }
  }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">
      <i class="fas fa-shield-alt" style="color: #c9a03d; font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>
      Verify OTP
    </div>
    <p class="auth-sub">
      Enter the 6-digit OTP sent to <span class="email-highlight">{{ email }}</span>
    </p>
    
    <form method="POST" class="auth-form">
      <div class="field">
        <label><i class="fas fa-lock"></i> OTP <span class="req">*</span></label>
        <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="_ _ _ _ _ _" required autocomplete="off">
      </div>
      
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-check-circle"></i> Verify OTP
      </button>
    </form>
    
    <form method="POST" class="resend-btn">
      <input type="hidden" name="action" value="resend">
      <button type="submit">
        <i class="fas fa-redo-alt"></i> Resend OTP
      </button>
    </form>
    
    <div class="back-link">
      <a href="{{ url_for('main.forgot_password') }}">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
