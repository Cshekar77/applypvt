<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Seat Availability | BCA Admissions 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #D4A017;
    --gold-light: #F5C842;
    --gold-deep: #A07010;
    --gold-glow: rgba(212, 160, 23, 0.35);
    --white: #FFFFFF;
    --off-white: #FBF7EE;
    --ink: #1A1208;
    --ink-2: #3D2E10;
    --ink-3: #6B5530;
    --border-l: rgba(212, 160, 23, 0.25);
    --border-l2: rgba(212, 160, 23, 0.5);
    --card-l: rgba(255, 255, 255, 0.9);
    --shadow-l: 0 4px 24px rgba(90, 50, 0, 0.12);
    --teal: #0A7C6E;
    --teal-bg: rgba(10, 124, 110, 0.10);
    --red: #C0392B;
    --red-bg: rgba(192, 57, 43, 0.10);
    --blue: #1A5FB4;
    --blue-bg: rgba(26, 95, 180, 0.10);
  }

  [data-theme="dark"] {
    --gold: #F0C040;
    --gold-light: #FFD966;
    --gold-deep: #C89A20;
    --gold-glow: rgba(240, 192, 64, 0.30);
    --white: #F5F0E8;
    --off-white: #1C1810;
    --ink: #F5F0E8;
    --ink-2: rgba(245, 240, 232, 0.70);
    --ink-3: rgba(245, 240, 232, 0.40);
    --border-l: rgba(240, 192, 64, 0.15);
    --border-l2: rgba(240, 192, 64, 0.35);
    --card-l: rgba(255, 255, 255, 0.06);
    --shadow-l: 0 4px 24px rgba(0, 0, 0, 0.40);
    --teal: #22D3C0;
    --teal-bg: rgba(34, 211, 192, 0.10);
    --red: #FF6B6B;
    --red-bg: rgba(255, 107, 107, 0.10);
    --blue: #60A5FA;
    --blue-bg: rgba(96, 165, 250, 0.10);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--off-white);
    color: var(--ink);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    padding-bottom: 60px;
  }

  .theme-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--card-l);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-l);
    color: var(--gold);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    box-shadow: var(--shadow-l);
  }
  .theme-btn:hover {
    transform: scale(1.05);
    border-color: var(--gold);
    box-shadow: 0 0 20px var(--gold-glow);
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
    padding: 20px 0 10px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .header p {
    color: var(--ink-3);
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--card-l);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-l);
    border-radius: 20px;
    padding: 16px 32px;
    text-align: center;
    min-width: 140px;
    box-shadow: var(--shadow-l);
  }
  .stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--ink-3);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 2rem;
    font-weight: 800;
    color: var(--gold);
  }

  .quota-section {
    margin-bottom: 32px;
  }
  .quota-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .quota-badge {
    padding: 8px 24px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .quota-badge.govt {
    background: var(--blue-bg);
    color: var(--blue);
    border: 1px solid rgba(26, 95, 180, 0.3);
  }
  .quota-badge.mgmt {
    background: rgba(212, 160, 23, 0.12);
    color: var(--gold-deep);
    border: 1px solid var(--border-l2);
  }
  [data-theme="dark"] .quota-badge.mgmt {
    color: var(--gold);
  }
  .quota-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border-l2), transparent);
  }

  .seat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }

  .seat-card {
    background: var(--card-l);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-l);
    border-radius: 20px;
    padding: 20px 16px;
    text-align: center;
    transition: all 0.3s;
    box-shadow: var(--shadow-l);
  }
  .seat-card:hover {
    transform: translateY(-3px);
    border-color: var(--border-l2);
  }

  .card-category {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--gold);
    display: inline-block;
  }

  .total-seats {
    margin-bottom: 12px;
  }
  .total-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--ink-3);
  }
  .total-number {
    font-size: 2rem;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.2;
  }

  .vacant-info {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border-l);
  }
  .vacant-label {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--ink-3);
  }
  .vacant-number {
    font-size: 1.8rem;
    font-weight: 800;
  }
  .vacant-number.available { color: var(--teal); }
  .vacant-number.low { color: var(--gold-deep); }
  .vacant-number.full { color: var(--red); }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--ink-3);
  }

  /* Ticker Styles */
  .ticker-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    background: rgba(10, 10, 26, 0.95);
    backdrop-filter: blur(16px);
    border-top: 2px solid var(--gold);
    display: flex;
    align-items: center;
    overflow: hidden;
    z-index: 100;
  }
  [data-theme="light"] .ticker-wrap {
    background: rgba(245, 240, 232, 0.95);
  }
  .ticker-label {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 0 20px;
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .ticker-label.govt-mode {
    background: linear-gradient(135deg, var(--blue), #0083b0);
    color: white;
  }
  .ticker-label.mgmt-mode {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #000;
  }
  .ticker-label.pause-mode {
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink-3);
  }
  .ticker-outer {
    flex: 1;
    overflow: hidden;
    height: 100%;
    position: relative;
  }
  .ticker-track {
    display: inline-flex;
    align-items: center;
    height: 100%;
    white-space: nowrap;
    position: absolute;
    left: 0;
    top: 0;
  }
  .ticker-item {
    display: inline-flex;
    align-items: center;
    padding: 0 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  .ticker-sep {
    color: var(--gold);
    font-size: 12px;
    margin: 0 6px;
  }
  .t-cat { font-weight: 800; color: var(--gold); }
  .t-lbl { color: var(--ink-3); font-size: 9px; font-weight: 600; margin: 0 4px; }
  .t-vacant { font-weight: 900; font-size: 13px; }
  .t-vacant.green { color: var(--teal); }
  .t-vacant.amber { color: var(--gold-deep); }
  .t-vacant.red { color: var(--red); }
  .t-total { color: var(--gold); font-weight: 800; }
  .ticker-head {
    display: inline-flex;
    align-items: center;
    padding: 0 16px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .ticker-head.govt-h { color: var(--blue); }
  .ticker-head.mgmt-h { color: #ffd200; }

  @media (max-width: 640px) {
    .container { padding: 16px; }
    .header h1 { font-size: 1.5rem; }
    .stat-value { font-size: 1.5rem; }
    .stat-card { padding: 12px 20px; min-width: 100px; }
    .seat-grid { gap: 12px; }
    .seat-card { padding: 16px 12px; }
    .card-category { font-size: 1rem; }
    .total-number { font-size: 1.5rem; }
    .vacant-number { font-size: 1.3rem; }
    .ticker-item { font-size: 10px; padding: 0 12px; }
    .ticker-label { font-size: 8px; padding: 0 12px; }
  }
</style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()">🌓</button>

<div class="container">
  <div class="header">
    <h1>Live Seat Availability</h1>
    <p>Real-time seat tracking • Auto-refreshes every 30 seconds</p>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Ranked</div>
      <div class="stat-value" id="totalRanked">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Seats Allotted</div>
      <div class="stat-value" id="totalAllotted">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Current Rank</div>
      <div class="stat-value" id="currentRank">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Remaining</div>
      <div class="stat-value" id="remainingSeats">—</div>
    </div>
  </div>

  <!-- Government Quota -->
  <div class="quota-section">
    <div class="quota-header">
      <div class="quota-badge govt">🏛 GOVERNMENT QUOTA</div>
      <div class="quota-line"></div>
    </div>
    <div class="seat-grid" id="govtGrid">
      <div class="loading">Loading seat data...</div>
    </div>
  </div>

  <!-- Management Quota -->
  <div class="quota-section">
    <div class="quota-header">
      <div class="quota-badge mgmt">💼 MANAGEMENT QUOTA</div>
      <div class="quota-line"></div>
    </div>
    <div class="seat-grid" id="mgmtGrid">
      <div class="loading">Loading seat data...</div>
    </div>
  </div>
</div>

<!-- Ticker -->
<div class="ticker-wrap">
  <div class="ticker-label govt-mode" id="tickerLabel">🏛 GOVT</div>
  <div class="ticker-outer">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
</div>

<script>
  const API_URL = "{{ url_for('main.counselling_live_status_api') }}";
  let govtSeats = [], mgmtSeats = [];
  let tickerState = 'govt-scroll';
  let tickerPos = 0;
  let animId = null;
  let lastTs = null;
  let pauseTimer = null;
  let trackHalfW = 0;
  let countdown = 30;
  let refreshTimer;
  const SPEED = 30;
  const PAUSE_MS = 5000;

  const track = document.getElementById('tickerTrack');
  const label = document.getElementById('tickerLabel');

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('seat_theme', next);
  }

  (function() {
    const saved = localStorage.getItem('seat_theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  })();

  function getVacantClass(remaining) {
    if (remaining <= 0) return 'full';
    if (remaining <= 3) return 'low';
    return 'available';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function renderSeatCards(containerId, seats) {
    const container = document.getElementById(containerId);
    if (!container) return;

    if (!seats || seats.length === 0) {
      container.innerHTML = '<div class="loading">No categories configured</div>';
      return;
    }

    container.innerHTML = seats.map(seat => {
      const vacantClass = getVacantClass(seat.remaining);
      const displayRemaining = seat.remaining <= 0 ? 'FULL' : seat.remaining;

      return `
        <div class="seat-card">
          <div class="card-category">${escapeHtml(seat.category)}</div>
          <div class="total-seats">
            <div class="total-label">TOTAL SEATS</div>
            <div class="total-number">${seat.total}</div>
          </div>
          <div class="vacant-info">
            <div class="vacant-label">VACANT</div>
            <div class="vacant-number ${vacantClass}">${displayRemaining}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Ticker Functions
  function buildTrackHTML(seats, headCls, headText) {
    let html = `<span class="ticker-head ${headCls}">${headText}</span>`;
    seats.forEach(s => {
      const isFull = s.remaining <= 0;
      const isLow = !isFull && s.remaining <= 3;
      let vacantClass = 'green';
      if (isFull) vacantClass = 'red';
      else if (isLow) vacantClass = 'amber';
      html += `<span class="ticker-item">
        <span class="t-cat">${escapeHtml(s.category)}</span>
        <span class="t-lbl">Vacant:</span>
        <span class="t-vacant ${vacantClass}">${isFull ? 'FULL' : s.remaining}</span>
        <span class="ticker-sep">◆</span>
        <span class="t-lbl">Total:</span>
        <span class="t-total">${s.total}</span>
        <span class="ticker-sep">●</span>
      </span>`;
    });
    return html + html;
  }

  function stopAnim() {
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (pauseTimer) { clearTimeout(pauseTimer); pauseTimer = null; }
    lastTs = null;
  }

  function startScroll() {
    lastTs = null;
    function step(ts) {
      if (lastTs === null) lastTs = ts;
      const dt = Math.min((ts - lastTs) / 1000, 0.1);
      lastTs = ts;
      tickerPos += SPEED * dt;
      if (tickerPos >= trackHalfW) {
        tickerPos = 0;
        track.style.transform = 'translateX(0)';
        animId = null;
        enterPause();
        return;
      }
      track.style.transform = `translateX(-${tickerPos}px)`;
      animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
  }

  function enterPause() {
    stopAnim();
    label.className = 'ticker-label pause-mode';
    label.textContent = '⏸ PAUSED';
    track.innerHTML = '';
    pauseTimer = setTimeout(() => {
      tickerState = tickerState === 'govt-scroll' ? 'mgmt-scroll' : 'govt-scroll';
      enterScroll();
    }, PAUSE_MS);
  }

  function enterScroll() {
    stopAnim();
    tickerPos = 0;
    if (tickerState === 'govt-scroll') {
      label.className = 'ticker-label govt-mode';
      label.textContent = '🏛 GOVT QUOTA';
      if (!govtSeats.length) { enterPause(); return; }
      track.innerHTML = buildTrackHTML(govtSeats, 'govt-h', '▶ GOVERNMENT QUOTA');
    } else {
      label.className = 'ticker-label mgmt-mode';
      label.textContent = '💼 MGMT QUOTA';
      if (!mgmtSeats.length) { enterPause(); return; }
      track.innerHTML = buildTrackHTML(mgmtSeats, 'mgmt-h', '▶ MANAGEMENT QUOTA');
    }
    requestAnimationFrame(() => {
      trackHalfW = track.scrollWidth / 2;
      track.style.transform = 'translateX(0)';
      startScroll();
    });
  }

  // Fetch Data
  async function fetchData() {
    try {
      const response = await fetch(API_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('API error');
      const data = await response.json();

      document.getElementById('totalRanked').textContent = data.total_ranked ?? '—';
      document.getElementById('totalAllotted').textContent = data.total_allotted ?? '—';
      document.getElementById('currentRank').textContent = data.current_rank ?? '—';
      
      const remaining = (data.total_ranked || 0) - (data.total_allotted || 0);
      document.getElementById('remainingSeats').textContent = remaining >= 0 ? remaining : '—';

      // Update seat data for ticker
      govtSeats = (data.govt_seats_list || []).map(s => ({
        category: s.category,
        total: s.total,
        filled: s.filled,
        remaining: s.remaining
      }));
      mgmtSeats = (data.mgmt_seats_list || []).map(s => ({
        category: s.category,
        total: s.total,
        filled: s.filled,
        remaining: s.remaining
      }));

      renderSeatCards('govtGrid', govtSeats);
      renderSeatCards('mgmtGrid', mgmtSeats);

    } catch (error) {
      console.error('Fetch error:', error);
    }
  }

  // Countdown Timer
  function startCountdown() {
    const countdownEl = document.getElementById('countdown');
    if (!countdownEl) return;
    if (refreshTimer) clearInterval(refreshTimer);

    refreshTimer = setInterval(() => {
      countdown--;
      if (countdownEl) countdownEl.textContent = countdown;
      
      if (countdown <= 0) {
        countdown = 30;
        fetchData();
        if (countdownEl) countdownEl.textContent = countdown;
      }
    }, 1000);
  }

  // Initial load
  fetchData();
  startCountdown();
  setTimeout(enterScroll, 1000);
</script>
</body>
</html>
