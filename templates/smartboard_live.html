<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Seat Display</title>
<style>
  :root {
    --bg:        #eef2ff;
    --surface:   #ffffff;
    --border:    #c0c8e8;
    --text:      #0a0a30;
    --muted:     #4455aa;
    --green:     #006b30;
    --amber:     #a05c00;
    --red:       #b80000;
    --govt-bg:   #d0ffe8;
    --govt-bdr:  #00a050;
    --govt-lbl:  #004d26;
    --mgmt-bg:   #fff3cc;
    --mgmt-bdr:  #c07000;
    --mgmt-lbl:  #7a4a00;
    --card-bg:   #ffffff;
    --card-bdr:  #b0bce8;
    --topbar-bg: #1a1a3e;
    --rank-bg:   #f59e0b;
  }
  [data-theme="dark"] {
    --bg:        #0a0a14;
    --surface:   #111127;
    --border:    #2a2a4a;
    --text:      #ffffff;
    --muted:     #9999bb;
    --green:     #00ff88;
    --amber:     #ffcc00;
    --red:       #ff4444;
    --govt-bg:   #0a2e1e;
    --govt-bdr:  #00ff88;
    --govt-lbl:  #00ff88;
    --mgmt-bg:   #2e1a00;
    --mgmt-bdr:  #ffcc00;
    --mgmt-lbl:  #ffcc00;
    --card-bg:   #13132a;
    --card-bdr:  #2a2a5a;
    --topbar-bg: #0d0d22;
    --rank-bg:   #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 56px;
  }

  .theme-btn {
    position: fixed; top: 14px; right: 16px; z-index: 999;
    background: var(--surface); border: 1.5px solid var(--border);
    color: var(--text); font-size: 20px; width: 40px; height: 40px;
    border-radius: 50%; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }

  /* TOP BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-around;
    padding: 0.85rem 1.5rem;
    background: var(--topbar-bg);
    border-bottom: 3px solid var(--rank-bg);
    flex-wrap: wrap; gap: 10px;
  }
  .topbar-stat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .topbar-label { font-size: 11px; color: #aaaacc; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
  .topbar-value { font-size: 2.5rem; font-weight: 900; color: #ffffff; line-height: 1; }
  .divider { width: 1.5px; background: #333366; height: 64px; }

  .rank-badge {
    background: var(--rank-bg); color: #000;
    font-size: 3.2rem; font-weight: 900;
    padding: 0.2rem 1.6rem; border-radius: 12px; line-height: 1.15;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 0 28px #f59e0b99;
  }
  .rank-badge .rlabel { font-size: 10px; font-weight: 900; letter-spacing: 3px; color: #7a4d00; text-transform: uppercase; }

  /* BOARD */
  .board { padding: 1.2rem 1.4rem 0.5rem; }
  .quota-section { margin-bottom: 1.5rem; }
  .quota-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .quota-pill {
    display: inline-block; font-size: 0.82rem; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 6px 22px; border-radius: 30px; border: 2.5px solid; white-space: nowrap;
  }
  .quota-pill.govt { background: var(--govt-bg); color: var(--govt-lbl); border-color: var(--govt-bdr); }
  .quota-pill.mgmt { background: var(--mgmt-bg); color: var(--mgmt-lbl); border-color: var(--mgmt-bdr); }
  .quota-line { flex: 1; height: 2px; background: var(--border); }

  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }

  .cat-card {
    background: var(--card-bg); border: 2.5px solid var(--card-bdr);
    border-radius: 16px; padding: 1.1rem 1.3rem 1rem;
    display: flex; flex-direction: column; gap: 1px;
    position: relative; overflow: hidden; transition: border-color 0.3s;
  }
  .cat-card.is-full { border-color: var(--red); background: #ffe8e8; }
  .cat-card.is-low  { border-color: var(--amber); }
  [data-theme="dark"] .cat-card.is-full { background: #2a0a0a; }

  .cat-name { font-size: 2.1rem; font-weight: 900; letter-spacing: 1px; color: var(--text); line-height: 1; }
  .cat-card.is-full .cat-name { color: var(--red); }

  .cat-total-label { font-size: 0.65rem; color: var(--muted); font-weight: 700; letter-spacing: 1.5px; margin-top: 7px; text-transform: uppercase; }
  .cat-total-val   { font-size: 1.6rem; font-weight: 800; color: var(--text); line-height: 1; }

  .cat-vacant-label { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 700; }
  .cat-vacant { font-size: 5rem; font-weight: 900; line-height: 1; letter-spacing: -2px; }
  .v-green { color: var(--green); }
  .v-amber { color: var(--amber); }
  .v-red   { color: var(--red); }
  [data-theme="dark"] .v-green { text-shadow: 0 0 18px #00ff8866; }
  [data-theme="dark"] .v-amber { text-shadow: 0 0 18px #ffcc0066; }
  [data-theme="dark"] .v-red   { text-shadow: 0 0 18px #ff444466; }

  .full-badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--red); color: #fff;
    font-size: 10px; font-weight: 900; letter-spacing: 2px;
    padding: 3px 9px; border-radius: 5px;
  }
  .no-cats { color: var(--muted); font-size: 1rem; padding: 0.8rem 0; font-style: italic; }

  /* TICKER */
  .ticker-wrap {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 50px; background: #0d0d22;
    border-top: 2.5px solid #f59e0b;
    display: flex; align-items: center;
    overflow: hidden; z-index: 100;
  }
  /* label changes colour based on which quota is showing */
  .ticker-label {
    font-size: 11px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase; padding: 0 14px; height: 100%;
    display: flex; align-items: center; white-space: nowrap;
    flex-shrink: 0; min-width: 110px; justify-content: center;
    transition: background 0.5s, color 0.5s;
  }
  .ticker-label.govt-mode { background: #00a050; color: #000; }
  .ticker-label.mgmt-mode { background: #f59e0b; color: #000; }
  .ticker-label.pause-mode { background: #222244; color: #aaaacc; }

  .ticker-outer { flex: 1; overflow: hidden; position: relative; height: 100%; }
  .ticker-track {
    display: inline-flex; align-items: center; height: 100%;
    white-space: nowrap; will-change: transform;
    position: absolute; left: 0; top: 0;
  }

  .ticker-item {
    display: inline-flex; align-items: center;
    padding: 0 22px; font-size: 14px; font-weight: 700;
    color: #ffffff; letter-spacing: 0.5px;
  }
  .ticker-sep  { color: #f59e0b; font-size: 16px; margin: 0 2px; }
  .t-cat       { color: #ffffff; font-weight: 800; }
  .t-lbl       { color: #ccccee; font-size: 12px; font-weight: 600; }
  .t-vn-g      { color: #00ff88; font-size: 17px; font-weight: 900; }
  .t-vn-a      { color: #ffcc00; font-size: 17px; font-weight: 900; }
  .t-vn-r      { color: #ff6666; font-size: 17px; font-weight: 900; }
  .t-tot       { color: #ffdd88; font-size: 15px; font-weight: 800; }
  .ticker-head {
    display: inline-flex; align-items: center; padding: 0 22px;
    font-size: 13px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
  }
  .ticker-head.govt-h { color: #00ff88; }
  .ticker-head.mgmt-h { color: #ffcc00; }
</style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌓</button>

<div class="topbar">
  <div class="topbar-stat">
    <span class="topbar-label">Total Ranked</span>
    <span class="topbar-value" id="val-ranked">—</span>
  </div>
  <div class="divider"></div>
  <div class="topbar-stat">
    <span class="topbar-label">Allotted</span>
    <span class="topbar-value" id="val-allotted">—</span>
  </div>
  <div class="divider"></div>
  <div class="rank-badge">
    <span class="rlabel">Current Rank</span>
    <span id="val-rank">—</span>
  </div>
  <div class="divider"></div>
  <div class="topbar-stat">
    <span class="topbar-label">Remaining</span>
    <span class="topbar-value" id="val-remaining">—</span>
  </div>
  <div class="divider"></div>
  <div class="topbar-stat">
    <span class="topbar-label">Total Seats</span>
    <span class="topbar-value" id="val-total-seats">—</span>
  </div>
</div>

<div class="board">
  <div class="quota-section">
    <div class="quota-header">
      <div class="quota-pill govt">🏛 Government Quota</div>
      <div class="quota-line"></div>
    </div>
    <div class="cat-grid" id="govt-grid"><p class="no-cats">Loading...</p></div>
  </div>
  <div class="quota-section">
    <div class="quota-header">
      <div class="quota-pill mgmt">💼 Management Quota</div>
      <div class="quota-line"></div>
    </div>
    <div class="cat-grid" id="mgmt-grid"><p class="no-cats">Loading...</p></div>
  </div>
</div>

<div class="ticker-wrap">
  <div class="ticker-label govt-mode" id="tickerLabel">🏛 GOVT</div>
  <div class="ticker-outer" id="tickerOuter">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
</div>

<script>
  // ── Theme ──
  function toggleTheme() {
    const h = document.documentElement;
    h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('smrt_theme', h.dataset.theme);
  }
  (function() {
    const s = localStorage.getItem('smrt_theme');
    if (s) document.documentElement.dataset.theme = s;
  })();

  // ── Card builder ──
  function cardHTML(s) {
    const isFull = s.remaining <= 0;
    const isLow  = !isFull && s.remaining <= 3;
    const cls    = isFull ? 'is-full' : isLow ? 'is-low' : '';
    const vcls   = isFull ? 'v-red' : isLow ? 'v-amber' : 'v-green';
    const badge  = isFull ? '<div class="full-badge">FULL</div>' : '';
    return `<div class="cat-card ${cls}">
      ${badge}
      <div class="cat-name">${s.name}</div>
      <div class="cat-total-label">Total Seats</div>
      <div class="cat-total-val">${s.total}</div>
      <div class="cat-vacant-label">Vacant Seats</div>
      <div class="cat-vacant ${vcls}">${s.remaining}</div>
    </div>`;
  }

  // ── Ticker state machine ──
  // States: 'govt-scroll' → 'pause' → 'mgmt-scroll' → 'pause' → repeat
  const SPEED      = 55;    // px per second — human readable
  const PAUSE_MS   = 5000;  // 5 second pause between quotas

  let govtSeats = [];
  let mgmtSeats = [];
  let tickerState = 'govt-scroll';
  let tickerPos   = 0;
  let animId      = null;
  let lastTs      = null;
  let pauseTimer  = null;
  let trackHalfW  = 0;

  const track = document.getElementById('tickerTrack');
  const label = document.getElementById('tickerLabel');

  function buildTrackHTML(seats, headCls, headText) {
    let html = `<span class="ticker-head ${headCls}">${headText}</span>`;
    seats.forEach(s => {
      const isFull = s.remaining <= 0;
      const isLow  = !isFull && s.remaining <= 3;
      const vcls   = isFull ? 't-vn-r' : isLow ? 't-vn-a' : 't-vn-g';
      const vdisp  = isFull
        ? `<span class="${vcls}">FULL</span>`
        : `<span class="${vcls}">${s.remaining}</span>`;
      html += `<span class="ticker-item">
        <span class="t-cat">${s.name}</span>&nbsp;
        <span class="t-lbl">Vacant:</span>&nbsp;${vdisp}&nbsp;
        <span class="t-lbl">|</span>&nbsp;
        <span class="t-lbl">Total:</span>&nbsp;<span class="t-tot">${s.total}</span>
        <span class="ticker-sep">◆</span>
      </span>`;
    });
    // Double for seamless scroll measurement
    return html + html;
  }

  function stopAnim() {
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (pauseTimer) { clearTimeout(pauseTimer); pauseTimer = null; }
    lastTs = null;
  }

  function startScroll() {
    lastTs = null;
    function step(ts) {
      if (lastTs === null) lastTs = ts;
      const dt = Math.min((ts - lastTs) / 1000, 0.1); // cap dt to avoid jump after tab switch
      lastTs = ts;
      tickerPos += SPEED * dt;
      if (tickerPos >= trackHalfW) {
        // completed one full pass — go to pause
        tickerPos = 0;
        track.style.transform = 'translateX(0)';
        animId = null;
        enterPause();
        return;
      }
      track.style.transform = `translateX(-${tickerPos}px)`;
      animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
  }

  function enterPause() {
    stopAnim();
    label.className = 'ticker-label pause-mode';
    label.textContent = '⏸ PAUSE';
    track.innerHTML = '';
    pauseTimer = setTimeout(() => {
      // switch quota
      tickerState = (tickerState === 'govt-scroll') ? 'mgmt-scroll' : 'govt-scroll';
      enterScroll();
    }, PAUSE_MS);
  }

  function enterScroll() {
    stopAnim();
    tickerPos = 0;

    if (tickerState === 'govt-scroll') {
      label.className = 'ticker-label govt-mode';
      label.textContent = '🏛 GOVT';
      if (!govtSeats.length) { enterPause(); return; }
      track.innerHTML = buildTrackHTML(govtSeats, 'govt-h', '▶ GOVERNMENT QUOTA SEATS');
    } else {
      label.className = 'ticker-label mgmt-mode';
      label.textContent = '💼 MGMT';
      if (!mgmtSeats.length) { enterPause(); return; }
      track.innerHTML = buildTrackHTML(mgmtSeats, 'mgmt-h', '▶ MANAGEMENT QUOTA SEATS');
    }

    // measure after render
    requestAnimationFrame(() => {
      trackHalfW = track.scrollWidth / 2;
      track.style.transform = 'translateX(0)';
      startScroll();
    });
  }

  // ── AJAX refresh ──
  function refresh() {
    fetch('/api/seat-matrix')
      .then(r => r.json())
      .then(data => {
        govtSeats = data.filter(d => !d.is_mgmt);
        mgmtSeats = data.filter(d => d.is_mgmt);

        document.getElementById('govt-grid').innerHTML = govtSeats.length
          ? govtSeats.map(cardHTML).join('')
          : '<p class="no-cats">No government quota categories configured.</p>';

        document.getElementById('mgmt-grid').innerHTML = mgmtSeats.length
          ? mgmtSeats.map(cardHTML).join('')
          : '<p class="no-cats">No management quota categories configured.</p>';

        document.getElementById('val-total-seats').textContent =
          data.reduce((a, d) => a + d.total, 0);
      })
      .catch(() => {});

    fetch('/live/status')
      .then(r => r.json())
      .then(d => {
        document.getElementById('val-ranked').textContent    = d.total_ranked   ?? '—';
        document.getElementById('val-allotted').textContent  = d.total_allotted ?? '—';
        document.getElementById('val-rank').textContent      = d.current_rank   ?? '—';
        const rem = (d.total_ranked || 0) - (d.total_allotted || 0);
        document.getElementById('val-remaining').textContent = rem >= 0 ? rem : '—';
      })
      .catch(() => {});
  }

  // Start
  refresh();
  setInterval(refresh, 10000);

  // Kick off ticker after first data likely loaded
  setTimeout(enterScroll, 800);
</script>
</body>
</html>
