{% extends 'base.html' %}
{% block title %}Reset Password — BCA Admissions{% endblock %}
{% block content %}
<style>
  .auth-wrap { min-height: calc(100vh - 300px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .auth-card { background: white; border-radius: 24px; padding: 2.5rem; max-width: 450px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: 1px solid #eef2f8; transition: transform 0.3s ease; }
  .auth-card:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(0,0,0,0.12); }
  .auth-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #0a1f44; margin-bottom: 0.5rem; text-align: center; }
  .auth-sub { color: #5a6e82; text-align: center; margin-bottom: 2rem; font-size: 0.95rem; }
  .auth-form { display: flex; flex-direction: column; gap: 1.5rem; }
  .field { display: flex; flex-direction: column; gap: 0.5rem; }
  .field label { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: #4a627a; }
  .req { color: #c9a03d; font-size: 1rem; }
  .field input { padding: 0.9rem 1rem; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; transition: all 0.3s ease; background: #fff; }
  .field input:focus { outline: none; border-color: #c9a03d; box-shadow: 0 0 0 3px rgba(201,160,61,0.1); }
  .btn-full { width: 100%; margin-top: 0.5rem; padding: 0.9rem; font-size: 1rem; font-weight: 600; }
  .password-requirements { font-size: 0.7rem; color: #8a92a0; margin-top: 0.25rem; }
  @media (max-width: 480px) {
    .auth-card { padding: 1.8rem; }
    .auth-title { font-size: 1.5rem; }
    .field input { padding: 0.8rem; }
  }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">
      <i class="fas fa-lock" style="color:#c9a03d;font-size:2rem;display:block;margin-bottom:0.5rem;"></i>
      Reset Password
    </div>
    <p class="auth-sub">Enter your new password</p>
    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
      <div class="field">
        <label><i class="fas fa-key"></i> New Password <span class="req">*</span></label>
        <input type="password" name="password" required placeholder="Enter new password" autocomplete="new-password">
        <div class="password-requirements"><i class="fas fa-info-circle"></i> Minimum 8 characters</div>
      </div>
      <div class="field">
        <label><i class="fas fa-check-circle"></i> Confirm New Password <span class="req">*</span></label>
        <input type="password" name="confirm_password" required placeholder="Re-enter new password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-save"></i> Reset Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
