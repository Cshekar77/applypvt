{% extends 'base.html' %}
{% block title %}Verify Email — BCA Admissions{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="otp-icon">&#9993;</div>
    <h2 class="auth-title">Verify Your Email</h2>
    <p class="auth-sub">We've sent a 6-digit OTP to <strong>{{ email }}</strong>.<br>Enter it below to activate your account.</p>

    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
      <input type="hidden" name="action" value="verify">
      <div class="field">
        <label>One-Time Password <span class="req">*</span></label>
        <input type="text" name="otp" required maxlength="6" placeholder="Enter 6-digit OTP"
               class="otp-input" autocomplete="one-time-code" inputmode="numeric">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Verify Email</button>
    </form>

    <div class="otp-resend">
      <p>Didn't receive it?</p>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
        <input type="hidden" name="action" value="resend">
        <button type="submit" class="btn btn-outline btn-sm">Resend OTP</button>
      </form>
    </div>
    <p class="auth-switch" style="margin-top:1rem">
      <a href="{{ url_for('main.register') }}">&larr; Back to Register</a>
    </p>
  </div>
</div>
{% endblock %}
