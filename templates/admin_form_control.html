{% extends 'base.html' %}
{% block title %}Form Control — Admin{% endblock %}
{% block content %}
<div class="page-wrap">
  <div class="page-header-inner">
    <h2>Form Control</h2>
    <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-outline btn-sm">&larr; Dashboard</a>
  </div>
  <div class="form-card" style="max-width:560px">
    <form method="POST">
      <div class="field" style="flex-direction:row;align-items:center;gap:1rem">
        <input type="checkbox" name="is_open" id="is_open" {% if settings.is_open %}checked{% endif %} style="width:20px;height:20px;accent-color:#0f1e3c">
        <label for="is_open" style="font-size:1rem;font-weight:500;color:#0f1e3c;cursor:pointer">Form is Open</label>
      </div>
      <div class="field" style="margin-top:1rem">
        <label>Open from (optional)</label>
        <input type="datetime-local" name="open_from" value="{{ settings.open_from.strftime('%Y-%m-%dT%H:%M') if settings.open_from else '' }}">
        <small style="color:#888">Leave blank to ignore timing</small>
      </div>
      <div class="field">
        <label>Open until (optional)</label>
        <input type="datetime-local" name="open_until" value="{{ settings.open_until.strftime('%Y-%m-%dT%H:%M') if settings.open_until else '' }}">
      </div>
      <div class="field">
        <label>Message to applicants (shown when closed)</label>
        <textarea name="message" rows="3" placeholder="e.g. Applications for 2026–27 are now closed.">{{ settings.message or '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
  </div>
</div>
{% endblock %}
