{% extends 'base.html' %}
{% block title %}Login — BCA Admissions{% endblock %}
{% block content %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 300px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .auth-card {
    background: white;
    border-radius: 24px;
    padding: 2.5rem;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    border: 1px solid #eef2f8;
    transition: transform 0.3s ease;
  }
  .auth-card:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(0,0,0,0.12); }
  .auth-title { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: #0a1f44; margin-bottom: 0.5rem; text-align: center; }
  .auth-sub { color: #5a6e82; text-align: center; margin-bottom: 2rem; font-size: 0.95rem; }
  .auth-form { display: flex; flex-direction: column; gap: 1.5rem; }
  .field { display: flex; flex-direction: column; gap: 0.5rem; }
  .field label { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: #4a627a; }
  .req { color: #c9a03d; font-size: 1rem; }
  .field input { padding: 0.9rem 1rem; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; transition: all 0.3s ease; background: #fff; }
  .field input:focus { outline: none; border-color: #c9a03d; box-shadow: 0 0 0 3px rgba(201,160,61,0.1); }
  .btn-full { width: 100%; margin-top: 0.5rem; padding: 0.9rem; font-size: 1rem; font-weight: 600; }
  .forgot-password { text-align: center; margin-top: 0.5rem; }
  .forgot-password a { color: #c9a03d; text-decoration: none; font-size: 0.85rem; }
  .forgot-password a:hover { color: #b58c2e; text-decoration: underline; }
  .auth-switch { text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #eef2f8; color: #5a6e82; font-size: 0.9rem; }
  .auth-switch a { color: #c9a03d; text-decoration: none; font-weight: 600; }
  .auth-switch a:hover { color: #b58c2e; text-decoration: underline; }
  .password-hint { font-size: 0.75rem; color: #8a92a0; margin-top: 0.25rem; }
  @media (max-width: 480px) {
    .auth-card { padding: 1.8rem; }
    .auth-title { font-size: 1.6rem; }
    .field input { padding: 0.8rem; }
  }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">
      <i class="fas fa-graduation-cap" style="color:#c9a03d;font-size:2rem;display:block;margin-bottom:0.5rem;"></i>
      Student Login
    </div>
    <p class="auth-sub">Welcome back! Log in to continue your application</p>
    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
      <div class="field">
        <label><i class="fas fa-envelope"></i> Email address <span class="req">*</span></label>
        <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label><i class="fas fa-lock"></i> Password <span class="req">*</span></label>
        <input type="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
        <div class="password-hint"><i class="fas fa-info-circle"></i> Minimum 8 characters</div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
      <div class="forgot-password">
        <a href="{{ url_for('main.forgot_password') }}"><i class="fas fa-key"></i> Forgot Password?</a>
      </div>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{{ url_for('main.register') }}"><i class="fas fa-user-plus"></i> Create Account</a></p>
  </div>
</div>
{% endblock %}
